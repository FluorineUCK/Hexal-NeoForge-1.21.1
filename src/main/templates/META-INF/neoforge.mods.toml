modLoader="kotlinforforge"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/FallingColors/Hexal/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/FallingColors/Hexal"
logoFile="logo.png"
credits="petrak@ and the other Hex Casting developers for the mod this addon extends."
authors="Talia; NeoForge 1.21.1 port maintained for this pack"
description='''
An addon for Hex Casting that adds wisps, motes, gates, links, relays,
the Everbook, freezing, slipways, and additional casting utilities.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="kotlinforforge"
type="required"
versionRange="[${kff_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="hexcasting"
type="required"
versionRange="[0.12.0-devel-pre-35,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="paucal"
type="required"
versionRange="[${paucal_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="patchouli"
type="required"
versionRange="[1.21.1-${patchouli_version}-NEOFORGE,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="moreiotas"
type="required"
versionRange="[${moreiotas_version},)"

ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="[${geckolib_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="hexdebug"
type="optional"
versionRange="[0.8.1,)"
ordering="AFTER"
side="BOTH"
